<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Phone Look</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; width: 100%; height: 100%; }
    #enable {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font: 18px/1.3 sans-serif;
      border: 0;
      cursor: pointer;
      z-index: 2;
    }
    #recenter {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 1;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font: 15px/1.2 sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="enable" type="button">Tap to enable motion</button>
  <button id="recenter" type="button">Recenter</button>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
